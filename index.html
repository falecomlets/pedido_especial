<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tenho uma pergunta... ❤️</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,.30),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ff5f6d,
          #ffc371
        );

      overflow: hidden;
    }


    /* =========================
       CARTÃO PRINCIPAL
    ========================= */

    .card {
      width: 100%;
      max-width: 620px;

      padding: 45px 30px;

      text-align: center;

      background: rgba(255,255,255,.16);

      border: 1px solid rgba(255,255,255,.30);

      border-radius: 30px;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 25px 60px rgba(0,0,0,.25);

      animation: entrada .8s ease;

      position: relative;

      z-index: 10;
    }


    @keyframes entrada {

      from {
        opacity: 0;
        transform:
          translateY(30px)
          scale(.95);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =========================
       CORAÇÃO PRINCIPAL
    ========================= */

    .coracao-principal {
      font-size: 70px;

      margin-bottom: 15px;

      animation: bater 1.2s infinite;
    }


    @keyframes bater {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

    }


    h1 {
      font-size: 36px;
      margin-bottom: 22px;
    }


    .mensagem {
      font-size: 18px;
      line-height: 1.7;

      margin-bottom: 30px;
    }


    .pergunta {
      font-size: 26px;
      font-weight: bold;

      margin-bottom: 30px;
    }


    /* =========================
       ÁREA DOS BOTÕES
    ========================= */

    .area-botoes {
      min-height: 80px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 20px;

      position: relative;
    }


    button {

      border: none;

      padding: 16px 30px;

      border-radius: 50px;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(0,0,0,.18);

      user-select: none;
      -webkit-user-select: none;

    }


    /* =========================
       BOTÃO SIM
    ========================= */

    #sim {

      background: white;
      color: #e63963;

      transition:
        transform .2s ease,
        box-shadow .2s ease;

    }


    #sim:hover {

      transform: scale(1.12);

      box-shadow:
        0 15px 30px rgba(0,0,0,.25);

    }


    /* =========================
       BOTÃO NÃO
       
       IMPORTANTE:
       ELE COMEÇA NORMAL.
       DEPOIS O JAVASCRIPT
       TRANSFORMA EM FIXED.
    ========================= */

    #nao {

      background: #333;
      color: white;

      z-index: 9999;

      transition:
        left .15s ease,
        top .15s ease;

      touch-action: none;

    }


    /* =========================
       TEXTO DE AVISO
    ========================= */

    .aviso {

      margin-top: 10px;

      font-size: 13px;

      opacity: .75;

    }


    /* =========================
       RESPOSTA FINAL
    ========================= */

    #resposta {

      display: none;

      animation: entrada .8s ease;

    }


    #resposta h2 {

      font-size: 34px;

      margin-bottom: 20px;

    }


    #resposta p {

      font-size: 19px;

      line-height: 1.7;

    }


    .emoji-final {

      font-size: 80px;

      margin-bottom: 20px;

      animation: bater .7s infinite;

    }
