<script>
  const botaoNao = document.getElementById("nao");
  const botaoSim = document.getElementById("sim");
  const conteudoInicial = document.getElementById("conteudoInicial");
  const resposta = document.getElementById("resposta");

  let tentativas = 0;
  let podeClicarNao = false;

  // Coloca o botão NÃO inicialmente ao lado do SIM
  function posicionarNao() {
    const simRect = botaoSim.getBoundingClientRect();

    botaoNao.style.left = (simRect.right + 15) + "px";
    botaoNao.style.top = simRect.top + "px";
  }

  window.addEventListener("load", posicionarNao);
  window.addEventListener("resize", posicionarNao);


  // Move o botão NÃO para um ponto aleatório da tela
  function fugirDoNao(event) {

    if (podeClicarNao) {
      return;
    }

    if (event) {
      event.preventDefault();
    }

    tentativas++;

    const margem = 20;

    const larguraBotao = botaoNao.offsetWidth;
    const alturaBotao = botaoNao.offsetHeight;

    const maxX =
      window.innerWidth - larguraBotao - margem;

    const maxY =
      window.innerHeight - alturaBotao - margem;

    const novoX =
      margem + Math.random() * (maxX - margem);

    const novoY =
      margem + Math.random() * (maxY - margem);

    botaoNao.style.left = novoX + "px";
    botaoNao.style.top = novoY + "px";


    // Mensagens engraçadas
    const frases = [
      "OPA! 😂",
      "NÃO TÃO RÁPIDO 😏",
      "QUASE! 😂",
      "TENTA DE NOVO 👀",
      "HAHAHAHA 😂",
      "O SIM TÁ ALI 👉 ❤️",
      "VOCÊ É PERSISTENTE 😂"
    ];

    if (tentativas <= frases.length) {
      botaoNao.innerHTML = frases[tentativas - 1];
    }


    // Depois de 7 tentativas deixa clicar
    if (tentativas >= 7) {

      podeClicarNao = true;

      botaoNao.innerHTML = "Tá bom... NÃO 😅";

      botaoNao.style.background = "#555";
    }
  }


  // Funciona com mouse, caneta e touchscreen
  botaoNao.addEventListener("pointerenter", fugirDoNao);


  // No celular, se tocar diretamente
  botaoNao.addEventListener("pointerdown", function(event) {

    if (!podeClicarNao) {
      fugirDoNao(event);
    }

  });


  // Clique no NÃO
  botaoNao.addEventListener("click", function(event) {

    if (!podeClicarNao) {

      event.preventDefault();
      fugirDoNao(event);

      return;
    }

    alert(
      "Tudo bem 😂 A brincadeira acaba aqui. Sem pressão ❤️"
    );

  });


  // Botão SIM
  botaoSim.addEventListener("click", function() {

    botaoNao.style.display = "none";

    conteudoInicial.style.display = "none";
    resposta.style.display = "block";

    festaDeCoracoes();

  });


  // Cria os corações
  function criarCoracao() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const emojis = [
      "❤️",
      "💕",
      "💖",
      "💗",
      "🤍",
      "🥳"
    ];

    heart.innerHTML =
      emojis[Math.floor(Math.random() * emojis.length)];

    heart.style.left =
      Math.random() * 100 + "vw";

    heart.style.fontSize =
      (20 + Math.random() * 35) + "px";

    heart.style.animationDuration =
      (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
      heart.remove();
    }, 6000);
  }
